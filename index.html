
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hadi Live Clock</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", Arial, sans-serif;
}

.clock-wrap {
    width: 100%;
    padding: 38px 12px 12px;
}

.clock {
    position: relative;
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 25px 30px 20px;
    border-radius: 28px;

    background: rgba(75, 75, 75, 0.73);

    border: 2px solid rgba(255, 190, 65, 0.85);

    box-shadow:
        0 0 8px rgba(255, 190, 65, 0.8),
        0 0 20px rgba(255, 170, 30, 0.45),
        inset 0 0 25px rgba(255, 255, 255, 0.08);

    overflow: hidden;
}

/* LIVE */

.live {
    position: absolute;
    top: -1px;
    left: 28px;
    z-index: 10;

    display: flex;
    align-items: center;
    gap: 9px;

    padding: 7px 20px 9px;
    border-radius: 0 0 15px 15px;

    background: linear-gradient(
        120deg,
        rgba(35, 25, 10, 0.98),
        rgba(90, 60, 15, 0.95)
    );

    border: 1px solid rgba(255, 200, 80, 0.8);
    border-top: none;

    color: #ffe4a1;
    font-size: 21px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: 2px;

    text-shadow: 0 0 10px #ffbd42;
}

.live-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ff3030;

    box-shadow:
        0 0 7px #ff3030,
        0 0 15px #ff3030;

    animation: liveBlink 1s infinite;
}

@keyframes liveBlink {
    0%, 100% {
        opacity: 1;
        box-shadow: 0 0 8px #ff3030, 0 0 18px #ff3030;
    }
    50% {
        opacity: 0.25;
        box-shadow: 0 0 2px #ff3030;
    }
}

/* CLOCK DISPLAY */

.time-row {
    position: relative;
    z-index: 2;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    padding-top: 20px;
}

.time-unit {
    min-width: 0;
    flex: 1;
    text-align: center;
}

.number {
    display: block;

    color: #fff4d2;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(65px, 12vw, 125px);
    font-weight: bold;
    line-height: 1.05;
    letter-spacing: 2px;

    background: linear-gradient(
        180deg,
        #ffffff 5%,
        #ffe9a7 35%,
        #d99b32 75%,
        #fff0bd 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.9))
            drop-shadow(0 0 9px rgba(255,190,60,0.8));
}

.label {
    display: inline-block;
    margin-top: 7px;
    padding: 4px 16px;

    min-width: 85px;

    color: #ffe5a5;
    font-family: Georgia, serif;
    font-size: clamp(12px, 2vw, 20px);
    font-weight: bold;
    letter-spacing: 4px;

    border-top: 1px solid rgba(255, 197, 79, 0.8);
    border-bottom: 1px solid rgba(255, 197, 79, 0.8);

    text-shadow: 0 0 8px rgba(255, 190, 60, 0.7);
}

.separator {
    color: #ffd77b;
    font-family: Georgia, serif;
    font-size: clamp(45px, 8vw, 85px);
    line-height: 1;
    margin-top: -18px;

    text-shadow:
        0 0 8px #ffba40,
        0 0 18px rgba(255, 180, 50, 0.8);
}

/* LIGHT SWEEP */

.light-sweep {
    position: absolute;
    z-index: 5;
    top: -100%;
    left: -35%;

    width: 13%;
    height: 300%;

    pointer-events: none;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.05),
        rgba(255, 225, 150, 0.75),
        rgba(255, 255, 255, 0.15),
        transparent
    );

    filter: blur(5px);
    transform: rotate(25deg);
    animation: sweep 3.8s linear infinite;
}

.light-sweep.two {
    width: 8%;
    opacity: 0.75;
    animation-duration: 4.7s;
    animation-delay: -1.8s;
    transform: rotate(25deg);
}

.light-sweep.three {
    width: 5%;
    opacity: 0.55;
    animation-duration: 3.2s;
    animation-delay: -2.4s;
    transform: rotate(25deg);
}

.light-sweep.four {
    width: 10%;
    opacity: 0.65;
    animation-duration: 5.2s;
    animation-delay: -3.1s;
    transform: rotate(25deg);
}

@keyframes sweep {
    0% {
        left: -35%;
    }
    100% {
        left: 135%;
    }
}

/* RUNNING GOLD BORDER */

.clock::before {
    content: "";
    position: absolute;
    z-index: 1;
    inset: -50%;
    border-radius: 50%;

    background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 230deg,
        rgba(255, 190, 50, 0.05) 250deg,
        rgba(255, 225, 150, 0.95) 270deg,
        rgba(255, 255, 255, 0.95) 276deg,
        rgba(255, 180, 40, 0.65) 285deg,
        transparent 310deg,
        transparent 360deg
    );

    animation: borderSpin 7s linear infinite;
    pointer-events: none;
}

.clock::after {
    content: "";
    position: absolute;
    z-index: 1;
    inset: 3px;
    border-radius: 24px;
    background: rgba(65, 65, 65, 0.93);
    pointer-events: none;
}

@keyframes borderSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* TOP AND BOTTOM GLINT */

.edge-glint {
    position: absolute;
    z-index: 6;
    height: 2px;
    width: 100px;
    left: -120px;

    background: linear-gradient(
        90deg,
        transparent,
        #fff,
        #ffc34f,
        transparent
    );

    box-shadow: 0 0 10px #ffca55;
    animation: edgeMove 3.4s linear infinite;
}

.edge-glint.top {
    top: 0;
}

.edge-glint.bottom {
    bottom: 0;
    animation-duration: 4.1s;
    animation-delay: -1.5s;
}

@keyframes edgeMove {
    from { left: -120px; }
    to { left: 110%; }
}

/* RESPONSIVE */

@media (max-width: 500px) {
    .clock {
        padding: 23px 12px 15px;
        border-radius: 20px;
    }

    .time-row {
        gap: 3px;
    }

    .number {
        font-size: clamp(48px, 14vw, 70px);
    }

    .separator {
        font-size: 40px;
    }

    .label {
        min-width: 55px;
        padding: 4px 5px;
        letter-spacing: 2px;
    }

    .live {
        left: 17px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="clock-wrap">
    <div class="clock">

        <div class="live">
            <span class="live-dot"></span>
            <span>. LIVE</span>
        </div>

        <div class="light-sweep"></div>
        <div class="light-sweep two"></div>
        <div class="light-sweep three"></div>
        <div class="light-sweep four"></div>

        <div class="edge-glint top"></div>
        <div class="edge-glint bottom"></div>

        <div class="time-row">

            <div class="time-unit">
                <span class="number" id="hour">00</span>
                <span class="label">HOUR</span>
            </div>

            <div class="separator">:</div>

            <div class="time-unit">
                <span class="number" id="minute">00</span>
                <span class="label">MIN</span>
            </div>

            <div class="separator">:</div>

            <div class="time-unit">
                <span class="number" id="second">00</span>
                <span class="label">SEC</span>
            </div>

        </div>
    </div>
</div>

<script>
function updateClock() {
    const now = new Date();

    document.getElementById("hour").textContent =
        String(now.getHours()).padStart(2, "0");

    document.getElementById("minute").textContent =
        String(now.getMinutes()).padStart(2, "0");

    document.getElementById("second").textContent =
        String(now.getSeconds()).padStart(2, "0");
}

updateClock();
setInterval(updateClock, 250);
</script>

</body>
</html>
